<script>
  let pontoAtual = 0;

  async function acessarPainel() {
    const cpf = document.getElementById('cpf').value.trim();
    const ref = document.getElementById('referencia').value.trim();

    if (!cpf || !ref) return alert('Preencha CPF e Referência!');
    if (cpf.length !== 11) return alert('CPF deve ter 11 números!');
    if (ref.length !== 8) return alert('A referência deve ter exatamente 8 números!');

    const url = `https://script.google.com/macros/s/AKfycbz2Xe-Ge7MzchHKpYxnFnfL9g3AjLf9ZtgU62gT9jwdo4LZRxpR9ywWfI9dVIu85QKvdw/exec?rota=/consultar_pontos_por_cpf_referencia?cpf_locador=${cpf}&referencia=${ref}`;

    try {
      const res = await fetch(url);
      const data = await res.json();

      // CORREÇÃO AQUI: aceita a nova estrutura da resposta
      if (!data || !data.pontos || data.pontos.length === 0) {
        return alert('CPF ou Referência incorretos! Nenhum ponto encontrado.');
      }

      // Tudo certo → entra no painel
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('painel-screen').classList.remove('hidden');

      const totalCreditos = data.pontos.reduce((sum, p) => sum + (parseInt(p.entradas) || 0), 0);
      document.getElementById('valor-bruto').innerHTML = 
        `VALOR BRUTO TOTAL: R$ ${totalCreditos.toFixed(2).replace('.', ',')}`;

      const container = document.getElementById('lista-pontos');
      container.innerHTML = '';

      data.pontos.forEach(ponto => {
        const div = document.createElement('div');
        div.className = 'ponto';
        div.innerHTML = `<strong>${ponto.nome.toUpperCase()}</strong>`;

        const detalhes = document.createElement('div');
        detalhes.className = 'detalhes';

        // Tratamento inteligente das músicas (JSON ou string antiga)
        let musicasHTML = '<div class="musicas-lista"><strong>Músicas tocadas:</strong><br>';
        if (ponto.musicas && ponto.musicas.trim() !== '') {
          try {
            const musicas = JSON.parse(ponto.musicas);
            const lista = Array.isArray(musicas) ? musicas : [musicas];
            if (lista.length > 0) {
              lista.forEach(m => {
                const titulo = m.titulo || m || 'Sem título';
                musicasHTML += `<div class="musica-item">• ${titulo}</div>`;
              });
            } else {
              musicasHTML += '<div class="musica-item">Nenhuma música tocada</div>';
            }
          } catch (e) {
            // Formato antigo (string separada por vírgula)
            const lista = ponto.musicas.split(',').map(m => m.trim()).filter(m => m);
            if (lista.length > 0) {
              lista.forEach(m => musicasHTML += `<div class="musica-item">• ${m}</div>`);
            } else {
              musicasHTML += '<div class="musica-item">Nenhuma música tocada</div>';
            }
          }
        } else {
          musicasHTML += '<div class="musica-item">Nenhuma música tocada ainda</div>';
        }
        musicasHTML += '</div>';

        detalhes.innerHTML = `
          <div class="info-grid">
            <div class="info-item"><strong>Entradas:</strong> ${ponto.entradas || 0} crédito(s)</div>
            <div class="info-item"><strong>Referência:</strong> ${ponto.usuario_id}</div>
            <div class="info-item"><strong>Locador:</strong> ${ponto.nome_locador}</div>
            <div class="info-item"><strong>CPF:</strong> ${ponto.cpf_locador}</div>
            <div class="info-item"><strong>E-mail:</strong> ${ponto.email_locador || 'Não informado'}</div>
            <div class="info-item"><strong>Contato:</strong> ${ponto.contato || 'Não informado'}</div>
          </div>
          <div class="senha-ponto">SENHA DO PONTO: ${ponto.senha}</div>
          ${musicasHTML}
          <button class="btn-porcentagem" onclick="event.stopPropagation(); abrirPopupPorcentagem(${ponto.entradas || 0})">
            CALCULAR MINHA PORCENTAGEM
          </button>
        `;

        div.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          const aberto = detalhes.style.display === 'block';
          document.querySelectorAll('.detalhes').forEach(d => d.style.display = 'none');
          detalhes.style.display = aberto ? 'none' : 'block';
        };

        div.appendChild(detalhes);
        container.appendChild(div);
      });

    } catch (err) {
      console.error(err);
      alert('Erro de conexão. Tente novamente.');
    }
  }

  function abrirPopupPorcentagem(entradas) {
    pontoAtual = entradas;
    document.getElementById('valor-ponto').textContent = entradas;
    document.getElementById('porcentagem-input').value = '';
    document.getElementById('resultado-box').classList.add('hidden');
    document.getElementById('popup-porcentagem').style.display = 'flex';
  }

  function calcularPorcentagem() {
    const pct = parseFloat(document.getElementById('porcentagem-input').value);
    if (!pct || pct < 1 || pct > 100) return alert('Digite uma porcentagem válida (1 a 100)');
    const recebe = (pontoAtual * pct / 100).toFixed(2).replace('.', ',');
    const sobra = (pontoAtual - (pontoAtual * pct / 100)).toFixed(2).replace('.', ',');
    document.getElementById('pct').textContent = pct;
    document.getElementById('recebe').textContent = recebe;
    document.getElementById('sobra').textContent = sobra;
    document.getElementById('resultado-box').classList.remove('hidden');
  }

  function fecharPopup() {
    document.getElementById('popup-porcentagem').style.display = 'none';
  }
</script>
